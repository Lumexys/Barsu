name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip -d proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and bundle
        working-directory: proj
        run: |
          npm install
          npm run bundle
      - name: Add Android platform
        working-directory: proj
        run: |
          npx cap add android
          cp native/*.java android/app/src/main/java/by/barsu/student/
          cp -r native/res/* android/app/src/main/res/
          python3 native/patch_android.py
          npx cap sync android
      - name: Stable signing key
        run: |
          mkdir -p ~/.android
          cp proj/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: proj/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: barsu-student-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk

