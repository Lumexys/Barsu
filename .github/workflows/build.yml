name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip -d proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and bundle
        working-directory: proj
        run: |
          npm install
          npm run bundle
      - name: Add Android platform
        working-directory: proj
        run: |
          npx cap add android
          cp native/*.java android/app/src/main/java/by/barsu/student/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: proj/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: barsu-student-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
